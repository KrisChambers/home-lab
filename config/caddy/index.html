<!DOCTYPE html>

<head>

  <style>
    :root {
      --bg: #0a0e14;
      --surface: #111820;
      --border: #1e2a38;
      --text: #c5cdd8;
      --text-dim: #5c6a7a;
      --accent: #3cead4;
      --accent-glow: rgba(60, 234, 212, 0.08);
      --red: #f07178;
      --amber: #ffb454;
      --blue: #59c2ff;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.25;
      pointer-events: none;
    }

    .container {
      max-width: 640px;
      width: 100%;
      position: relative;
    }

    /* Header */
    .header {
      margin-bottom: 3rem;
    }

    .header h1 {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .header h1::before {
      content: '~/';
      color: var(--text-dim);
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: 300;
    }

    /* Service list */
    .services {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .service {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: var(--surface);
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s ease, padding-left 0.15s ease;
    }

    .service:hover {
      background: var(--accent-glow);
      padding-left: 1.5rem;
    }

    .service-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .service-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .service-name {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .service-desc {
      font-size: 0.78rem;
      color: var(--text-dim);
      font-weight: 300;
      margin-top: 0.15rem;
    }

    .service-port {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .service:hover .service-name { color: var(--accent); }
    .service:hover .service-port { color: var(--text); }

    /* Status dot */
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      flex-shrink: 0;
      margin-right: 0.5rem;
    }

    /* Icon backgrounds */
    .icon-blue   { background: rgba(89, 194, 255, 0.1); color: var(--blue); }
    .icon-green  { background: rgba(60, 234, 212, 0.1);  color: var(--accent); }
    .icon-red    { background: rgba(240, 113, 120, 0.1); color: var(--red); }
    .icon-amber  { background: rgba(255, 180, 84, 0.1);  color: var(--amber); }

    /* Footer */
    .footer {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    /* Entrance animation */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header    { animation: slideIn 0.4s ease both; }
    .services  { animation: slideIn 0.4s ease 0.1s both; }
    .footer    { animation: slideIn 0.4s ease 0.2s both; }
  </style>
</head>
